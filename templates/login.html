<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo 1.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="header">
        <img id="logo" src="{{ url_for('static', filename='images/logo 1.png') }}">
        <h1>MAILAM ENGINEERING COLLEGE</h1>
    </div>
    <div class="flex">
    <div class="container">
        <div class="left-panel">
            <img src="{{ url_for('static', filename='images/college.jpg') }}" alt="MEC">
        </div>
        
        <div class="right-panel">
            <h2>Sign In</h2><br>
            <form id="loginForm" action="{{ url_for('login') }}" method="post">
                <div class="input-container">
                    <i class="fas fa-user"></i> <!-- Username Icon -->
                    <input type="text" name="username" placeholder="Username" required>
                </div>
                <div class="input-container">
                    <i class="fas fa-lock"></i> <!-- Password Icon -->
                    <input type="password" name="password" placeholder="Password" required>
                </div><br>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</div>
<p>A Place to Foster Innovative Technologies</p>
</body>
</html>
